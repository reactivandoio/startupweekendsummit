# Config compartilhada do par blue/green de produção (services.app-blue / app-green).
# Produção: bash deploy/blue-green.sh  (lê o .env deste diretório; sem porta de host,
# o proxy nginx fala com a cor ativa pela rede "proxy" — ver docker-compose.proxy.yml)
x-app: &app
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-dev}
      BUILD_TIME: ${BUILD_TIME:-}
      # a MESMA chave em blue e green, senão as Server Actions quebram na troca.
      # Obrigatória no deploy de produção — ver docker-compose.proxy.yml.
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
  restart: unless-stopped
  environment:
    TZ: America/Sao_Paulo
    DATABASE_URL: postgres://sws:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/sws
    APP_URL: ${APP_URL:-https://startupweekendsummit.com.br}
    ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
    ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    EMAIL_FROM: ${EMAIL_FROM:-}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    TICKET_PRICE_CENTS: ${TICKET_PRICE_CENTS:-}
  image: startupweekendsummit-app
  depends_on:
    db:
      condition: service_healthy
  profiles: ["prod"]
  healthcheck:
    test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  # Desenvolvimento com hot reload: docker compose --profile dev up
  dev:
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgres://sws:${POSTGRES_PASSWORD:-sws}@db-dev:5432/sws
      APP_URL: ${APP_URL:-http://localhost:3001}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TICKET_PRICE_CENTS: ${TICKET_PRICE_CENTS:-}
    volumes:
      - .:/app
      # node_modules e .next ficam em volumes nomeados pra não misturar com o host
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
    depends_on:
      db-dev:
        condition: service_healthy
    profiles: ["dev"]

  db-dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sws}
      POSTGRES_DB: sws
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sws -d sws"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["dev"]

  # Produção: par blue/green (deploy/blue-green.sh sobe a cor inativa, espera o
  # healthcheck e só então troca o nginx).
  app-blue:
    <<: *app
  app-green:
    <<: *app

  db:
    image: postgres:16-alpine
    container_name: startupweekendsummit-db
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: sws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: sws
    volumes:
      # dados do banco; volume nomeado, sobrevive ao deploy
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sws -d sws"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["prod"]

volumes:
  dev_node_modules:
  dev_next:
  pgdata_dev:
  pgdata:
