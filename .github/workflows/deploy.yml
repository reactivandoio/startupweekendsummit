name: Deploy (jarvis)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, jarvis]
    timeout-minutes: 30
    env:
      DEPLOY_DIR: /mnt/hd2tb/projetos/startupweekendsummit
    steps:
      - name: Atualizar codigo no diretorio de producao
        run: |
          cd "$DEPLOY_DIR"
          git fetch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" main
          git checkout -q main
          git merge --ff-only FETCH_HEAD
          git log --oneline -1

      - name: Deploy blue-green (build, healthcheck, troca o nginx, aposenta o antigo)
        run: |
          cd "$DEPLOY_DIR"
          export GIT_SHA=$(git rev-parse --short HEAD)
          export BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          bash deploy/blue-green.sh

      - name: Limpar imagens antigas
        if: always()
        run: docker image prune -f
